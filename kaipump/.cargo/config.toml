# Static linking is not a size preference -- it is what lets one binary run on
# a bionic far older than the NDK's minimum API level.  KaiOS 2.x sits on an
# Android 4.4-era base; a dynamically linked binary risks missing symbols at
# load time, and a static one only needs the syscalls to exist.
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
rustflags = ["-C", "target-feature=+crt-static"]
